name: 'Auto-ZAP Security Scanner'
description: 'Zero-config OWASP ZAP security scanner. Auto-detects 30+ frameworks, databases, and auth.'
author: 'anubissbe'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  url:
    description: 'Target URL to scan (skips auto-detection if provided)'
    required: false
    default: ''
  port:
    description: 'Override the detected application port'
    required: false
    default: ''
  report-path:
    description: 'Custom path for the HTML report (default: zap-report-<timestamp>.html)'
    required: false
    default: ''
  full-scan:
    description: 'Run a thorough active scan (slower, 60 min timeout)'
    required: false
    default: 'false'
  keep-docker:
    description: 'Do not stop Docker containers after the scan'
    required: false
    default: 'false'
  skip-install:
    description: 'Skip dependency installation'
    required: false
    default: 'false'
  auth-user:
    description: 'Username for authenticated scanning'
    required: false
    default: ''
  auth-password:
    description: 'Password for authenticated scanning'
    required: false
    default: ''
  auth-url:
    description: 'Login endpoint URL (auto-detected if not provided)'
    required: false
    default: ''
  auth-token:
    description: 'Pre-obtained Bearer token (skips login flow)'
    required: false
    default: ''
  auth-type:
    description: 'Authentication type: form, json, or bearer'
    required: false
    default: ''
  auto-auth:
    description: 'Automatically detect auth, create a temp user, and run an authenticated scan'
    required: false
    default: 'false'
  scan-mode:
    description: 'Scan mode: auto (default), webapp, api, or static'
    required: false
    default: 'auto'
  verbose:
    description: 'Enable verbose debug logging'
    required: false
    default: 'false'
  dry-run:
    description: 'Show what would happen without executing any scan'
    required: false
    default: 'false'
  use-docker-zap:
    description: 'Force ZAP to run in Docker mode instead of local Java'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory for the scan (default: repository root)'
    required: false
    default: '.'

outputs:
  report-path:
    description: 'Path to the generated HTML report'
    value: ${{ steps.results.outputs.report-path }}
  json-path:
    description: 'Path to the generated JSON report'
    value: ${{ steps.results.outputs.json-path }}
  sarif-path:
    description: 'Path to the generated SARIF report'
    value: ${{ steps.results.outputs.sarif-path }}
  high-count:
    description: 'Number of HIGH severity vulnerabilities'
    value: ${{ steps.results.outputs.high-count }}
  medium-count:
    description: 'Number of MEDIUM severity vulnerabilities'
    value: ${{ steps.results.outputs.medium-count }}
  low-count:
    description: 'Number of LOW severity vulnerabilities'
    value: ${{ steps.results.outputs.low-count }}

runs:
  using: 'composite'
  steps:
    # ---- Linux: Run auto-zap.sh ----
    - name: Make auto-zap.sh executable
      if: runner.os == 'Linux'
      shell: bash
      run: chmod +x "${{ github.action_path }}/auto-zap.sh"

    - name: Run Auto-ZAP (Linux)
      id: scan-linux
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_FULL_SCAN: ${{ inputs.full-scan }}
        INPUT_KEEP_DOCKER: ${{ inputs.keep-docker }}
        INPUT_SKIP_INSTALL: ${{ inputs.skip-install }}
        INPUT_AUTH_USER: ${{ inputs.auth-user }}
        INPUT_AUTH_PASSWORD: ${{ inputs.auth-password }}
        INPUT_AUTH_URL: ${{ inputs.auth-url }}
        INPUT_AUTH_TOKEN: ${{ inputs.auth-token }}
        INPUT_AUTH_TYPE: ${{ inputs.auth-type }}
        INPUT_AUTO_AUTH: ${{ inputs.auto-auth }}
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_USE_DOCKER_ZAP: ${{ inputs.use-docker-zap }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        ARGS=()
        if [[ -n "$INPUT_URL" ]]; then ARGS+=(--url "$INPUT_URL"); fi
        if [[ -n "$INPUT_PORT" ]]; then ARGS+=(--port "$INPUT_PORT"); fi
        if [[ -n "$INPUT_REPORT_PATH" ]]; then ARGS+=(--report-path "$INPUT_REPORT_PATH"); fi
        if [[ "$INPUT_FULL_SCAN" == "true" ]]; then ARGS+=(--full-scan); fi
        if [[ "$INPUT_KEEP_DOCKER" == "true" ]]; then ARGS+=(--keep-docker); fi
        if [[ "$INPUT_SKIP_INSTALL" == "true" ]]; then ARGS+=(--skip-install); fi
        if [[ -n "$INPUT_AUTH_USER" ]]; then ARGS+=(--auth-user "$INPUT_AUTH_USER"); fi
        if [[ -n "$INPUT_AUTH_PASSWORD" ]]; then ARGS+=(--auth-password "$INPUT_AUTH_PASSWORD"); fi
        if [[ -n "$INPUT_AUTH_URL" ]]; then ARGS+=(--auth-url "$INPUT_AUTH_URL"); fi
        if [[ -n "$INPUT_AUTH_TOKEN" ]]; then ARGS+=(--auth-token "$INPUT_AUTH_TOKEN"); fi
        if [[ -n "$INPUT_AUTH_TYPE" ]]; then ARGS+=(--auth-type "$INPUT_AUTH_TYPE"); fi
        if [[ "$INPUT_AUTO_AUTH" == "true" ]]; then ARGS+=(--auto-auth); fi
        if [[ -n "$INPUT_SCAN_MODE" && "$INPUT_SCAN_MODE" != "auto" ]]; then ARGS+=(--scan-mode "$INPUT_SCAN_MODE"); fi
        if [[ "$INPUT_VERBOSE" == "true" ]]; then ARGS+=(--verbose); fi
        if [[ "$INPUT_DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
        if [[ "$INPUT_USE_DOCKER_ZAP" == "true" ]]; then ARGS+=(--use-docker-zap); fi

        "$ACTION_PATH/auto-zap.sh" "${ARGS[@]}" || EXIT_CODE=$?

        # Capture report paths
        REPORT=$(ls zap-report-*.html 2>/dev/null | head -1 || echo "")
        JSON=$(ls zap-report-*.json 2>/dev/null | head -1 || echo "")
        SARIF=$(ls zap-report-*.sarif 2>/dev/null | head -1 || echo "")

        echo "report-path=$REPORT" >> $GITHUB_OUTPUT
        echo "json-path=$JSON" >> $GITHUB_OUTPUT
        echo "sarif-path=$SARIF" >> $GITHUB_OUTPUT

        # Parse counts
        if [[ -f "$JSON" ]]; then
          echo "high-count=$(jq '[.alerts[] | select(.risk=="3" or .risk=="High")] | length' "$JSON")" >> $GITHUB_OUTPUT
          echo "medium-count=$(jq '[.alerts[] | select(.risk=="2" or .risk=="Medium")] | length' "$JSON")" >> $GITHUB_OUTPUT
          echo "low-count=$(jq '[.alerts[] | select(.risk=="1" or .risk=="Low")] | length' "$JSON")" >> $GITHUB_OUTPUT
        else
          echo "high-count=0" >> $GITHUB_OUTPUT
          echo "medium-count=0" >> $GITHUB_OUTPUT
          echo "low-count=0" >> $GITHUB_OUTPUT
        fi

        exit ${EXIT_CODE:-0}

    # ---- Windows: Run auto-zap.ps1 ----
    - name: Run Auto-ZAP (Windows)
      id: scan-windows
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_FULL_SCAN: ${{ inputs.full-scan }}
        INPUT_KEEP_DOCKER: ${{ inputs.keep-docker }}
        INPUT_SKIP_INSTALL: ${{ inputs.skip-install }}
        INPUT_AUTH_USER: ${{ inputs.auth-user }}
        INPUT_AUTH_PASSWORD: ${{ inputs.auth-password }}
        INPUT_AUTH_URL: ${{ inputs.auth-url }}
        INPUT_AUTH_TOKEN: ${{ inputs.auth-token }}
        INPUT_AUTH_TYPE: ${{ inputs.auth-type }}
        INPUT_AUTO_AUTH: ${{ inputs.auto-auth }}
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_USE_DOCKER_ZAP: ${{ inputs.use-docker-zap }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        $scanArgs = @()
        if ($env:INPUT_URL) { $scanArgs += @("-Url", $env:INPUT_URL) }
        if ($env:INPUT_PORT) { $scanArgs += @("-Port", [int]$env:INPUT_PORT) }
        if ($env:INPUT_REPORT_PATH) { $scanArgs += @("-ReportPath", $env:INPUT_REPORT_PATH) }
        if ($env:INPUT_FULL_SCAN -eq "true") { $scanArgs += "-FullScan" }
        if ($env:INPUT_KEEP_DOCKER -eq "true") { $scanArgs += "-KeepDocker" }
        if ($env:INPUT_SKIP_INSTALL -eq "true") { $scanArgs += "-SkipInstall" }
        if ($env:INPUT_AUTH_USER) { $scanArgs += @("-AuthUser", $env:INPUT_AUTH_USER) }
        if ($env:INPUT_AUTH_PASSWORD) { $scanArgs += @("-AuthPassword", $env:INPUT_AUTH_PASSWORD) }
        if ($env:INPUT_AUTH_URL) { $scanArgs += @("-AuthUrl", $env:INPUT_AUTH_URL) }
        if ($env:INPUT_AUTH_TOKEN) { $scanArgs += @("-AuthToken", $env:INPUT_AUTH_TOKEN) }
        if ($env:INPUT_AUTH_TYPE) { $scanArgs += @("-AuthType", $env:INPUT_AUTH_TYPE) }
        if ($env:INPUT_AUTO_AUTH -eq "true") { $scanArgs += "-AutoAuth" }
        if ($env:INPUT_SCAN_MODE -and $env:INPUT_SCAN_MODE -ne "auto") { $scanArgs += @("-ScanMode", $env:INPUT_SCAN_MODE) }
        if ($env:INPUT_VERBOSE -eq "true") { $scanArgs += "-VerboseLog" }
        if ($env:INPUT_DRY_RUN -eq "true") { $scanArgs += "-DryRun" }
        if ($env:INPUT_USE_DOCKER_ZAP -eq "true") { $scanArgs += "-UseDockerZap" }

        & "$env:ACTION_PATH/auto-zap.ps1" @scanArgs

        # Capture report paths
        $report = Get-ChildItem -Filter "zap-report-*.html" -ErrorAction SilentlyContinue | Select-Object -First 1
        $json = Get-ChildItem -Filter "zap-report-*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
        $sarif = Get-ChildItem -Filter "zap-report-*.sarif" -ErrorAction SilentlyContinue | Select-Object -First 1

        "report-path=$($report.Name)" >> $env:GITHUB_OUTPUT
        "json-path=$($json.Name)" >> $env:GITHUB_OUTPUT
        "sarif-path=$($sarif.Name)" >> $env:GITHUB_OUTPUT

        if ($json -and (Test-Path $json.FullName)) {
          $alerts = (Get-Content $json.FullName | ConvertFrom-Json).alerts
          "high-count=$(@($alerts | Where-Object { $_.risk -eq '3' -or $_.risk -eq 'High' }).Count)" >> $env:GITHUB_OUTPUT
          "medium-count=$(@($alerts | Where-Object { $_.risk -eq '2' -or $_.risk -eq 'Medium' }).Count)" >> $env:GITHUB_OUTPUT
          "low-count=$(@($alerts | Where-Object { $_.risk -eq '1' -or $_.risk -eq 'Low' }).Count)" >> $env:GITHUB_OUTPUT
        } else {
          "high-count=0" >> $env:GITHUB_OUTPUT
          "medium-count=0" >> $env:GITHUB_OUTPUT
          "low-count=0" >> $env:GITHUB_OUTPUT
        }

    # ---- Unified outputs ----
    - name: Set outputs
      id: results
      shell: bash
      if: always()
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          echo "report-path=${{ steps.scan-linux.outputs.report-path }}" >> $GITHUB_OUTPUT
          echo "json-path=${{ steps.scan-linux.outputs.json-path }}" >> $GITHUB_OUTPUT
          echo "sarif-path=${{ steps.scan-linux.outputs.sarif-path }}" >> $GITHUB_OUTPUT
          echo "high-count=${{ steps.scan-linux.outputs.high-count }}" >> $GITHUB_OUTPUT
          echo "medium-count=${{ steps.scan-linux.outputs.medium-count }}" >> $GITHUB_OUTPUT
          echo "low-count=${{ steps.scan-linux.outputs.low-count }}" >> $GITHUB_OUTPUT
        else
          echo "report-path=${{ steps.scan-windows.outputs.report-path }}" >> $GITHUB_OUTPUT
          echo "json-path=${{ steps.scan-windows.outputs.json-path }}" >> $GITHUB_OUTPUT
          echo "sarif-path=${{ steps.scan-windows.outputs.sarif-path }}" >> $GITHUB_OUTPUT
          echo "high-count=${{ steps.scan-windows.outputs.high-count }}" >> $GITHUB_OUTPUT
          echo "medium-count=${{ steps.scan-windows.outputs.medium-count }}" >> $GITHUB_OUTPUT
          echo "low-count=${{ steps.scan-windows.outputs.low-count }}" >> $GITHUB_OUTPUT
        fi
