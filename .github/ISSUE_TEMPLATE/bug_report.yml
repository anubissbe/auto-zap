name: Bug Report
description: Report a bug in Auto-ZAP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (auto-zap.ps1)
        - Linux (auto-zap.sh)
        - GitHub Actions
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS Version
      placeholder: "e.g., Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Framework being scanned
      placeholder: "e.g., Next.js 15, Django 5.1, Spring Boot 3.x"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste the relevant console output (redact any secrets).
      render: shell

  - type: input
    id: version
    attributes:
      label: Auto-ZAP version
      placeholder: "e.g., v1.2.0 or commit hash"
